<!-- BEGIN: Interactive Logic Script -->
<script data-purpose="keyboard-play-trigger">
    // Spacebar listener to launch the game smoothly matching the button cue
    document.addEventListener('keydown', function(event) {
      if (event.code === 'Space' && !event.repeat) {
        event.preventDefault();
        const playBtn = document.getElementById('btn-play-hero');
        if (playBtn) {
          playBtn.classList.add('translate-y-1.5');
          setTimeout(() => {
            playBtn.classList.remove('translate-y-1.5');
            console.log('Game Started via Keyboard [SPACE]');
          }, 150);
        }
      }
    });

    // Sound toggle interactive state feedback
    const soundBtn = document.getElementById('btn-sound-toggle');
    let isMuted = false;
    soundBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      soundBtn.style.opacity = isMuted ? '0.6' : '1.0';
    });

    // Fullscreen toggle interactive helper
    const fullscreenBtn = document.getElementById('btn-fullscreen-toggle');
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn('Fullscreen request denied:', err);
        });
      } else {
        document.exitFullscreen();
      }
    });
  </script>
<!-- END: Interactive Logic Script -->
