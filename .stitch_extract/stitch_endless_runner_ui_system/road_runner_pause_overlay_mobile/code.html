<div class="absolute inset-0 bg-surface-container-lowest/80 backdrop-blur-md"></div>
<!-- Ambient energetic arcade bloom lights -->
<div class="absolute -top-12 left-1/2 -translate-x-1/2 w-72 h-72 bg-secondary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-10 left-1/2 -translate-x-1/2 w-64 h-64 bg-primary-container/20 rounded-full blur-3xl pointer-events-none"></div>
</div>
<!-- In-game Minimal Floating Top HUD Context -->
<div class="w-full flex items-center justify-between px-space-xs mb-space-md opacity-75">
<div class="flex items-center gap-space-xs bg-surface-container-high/80 px-space-sm py-1 rounded-full shadow-sm">
<span class="material-symbols-outlined text-secondary text-sm" style="font-variation-settings: 'FILL' 1;">speed</span>
<span class="font-label-md text-label-md text-on-surface tracking-wider">ZONE 03 // PACIFIC</span>
</div>
<div class="flex items-center gap-space-xs bg-surface-container-high/80 px-space-sm py-1 rounded-full shadow-sm">
<span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span>
<span class="font-label-md text-label-md text-tertiary">STREAK x3</span>
</div>
</div>
<!-- Centered Polished Pause Modal Card (Arcade Velocity Style) -->
<div class="relative w-full rounded-xl bg-surface-container-low shadow-2xl p-space-lg flex flex-col items-center">
<!-- Inner ambient glow & glass layer -->
<div class="absolute inset-0 rounded-xl bg-gradient-to-b from-primary/10 via-transparent to-surface-container-lowest/70 pointer-events-none"></div>
<!-- Glowing PAUSED Header Badge -->
<div class="relative flex flex-col items-center mb-space-md">
<div class="w-14 h-14 rounded-full bg-surface-container-highest shadow-md flex items-center justify-center mb-space-xs relative">
<div class="absolute inset-0 rounded-full bg-primary/20 animate-ping opacity-40"></div>
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">pause</span>
</div>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-wider text-center drop-shadow-md">
        PAUSED
      </h1>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest mt-0.5">
        Session Suspended
      </p>
</div>
<!-- Current Run Snapshot Bento Stats Panel -->
<div class="w-full bg-surface-container rounded-lg p-space-md mb-space-lg shadow-inner flex flex-col gap-space-sm">
<!-- Main Live Score Counter Display -->
<div class="flex flex-col items-center justify-center bg-surface-container-lowest/80 rounded-DEFAULT py-space-sm px-space-md">
<span class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1 uppercase">
<span class="material-symbols-outlined text-sm text-primary" style="font-variation-settings: 'FILL' 1;">hotel_class</span>
          Current Score
        </span>
<div class="flex items-baseline gap-1 mt-0.5">
<span class="font-counter-display text-counter-display text-primary tracking-tight" id="pause-score">52,430</span>
<span class="font-label-md text-label-md text-primary/70">PTS</span>
</div>
</div>
<!-- Distance and Coins Row -->
<div class="grid grid-cols-2 gap-space-sm">
<!-- Distance Stat Card -->
<div class="flex flex-col items-center justify-center bg-surface-container-lowest/80 rounded-DEFAULT py-space-sm px-space-xs">
<div class="flex items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined text-base text-tertiary" style="font-variation-settings: 'FILL' 1;">near_me</span>
<span class="font-label-md text-label-md uppercase">Distance</span>
</div>
<div class="flex items-baseline gap-0.5 mt-0.5">
<span class="font-headline-sm text-headline-sm text-tertiary">1,680</span>
<span class="font-label-md text-label-md text-tertiary/70">m</span>
</div>
</div>
<!-- Coins Stat Card -->
<div class="flex flex-col items-center justify-center bg-surface-container-lowest/80 rounded-DEFAULT py-space-sm px-space-xs">
<div class="flex items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined text-base text-secondary" style="font-variation-settings: 'FILL' 1;">monetization_on</span>
<span class="font-label-md text-label-md uppercase">Banked</span>
</div>
<div class="flex items-baseline gap-0.5 mt-0.5">
<span class="font-headline-sm text-headline-sm text-secondary">315</span>
<span class="font-label-md text-label-md text-secondary/70">C</span>
</div>
</div>
</div>
</div>
<!-- Primary Action: Big Tactile 3D Orange RESUME Button -->
<button class="group relative w-full h-14 min-h-[56px] rounded-DEFAULT bg-secondary-container text-on-secondary-container font-label-lg text-label-lg tracking-wider uppercase flex items-center justify-center gap-space-sm shadow-[0_5px_0_#9a4e00] active:translate-y-1 active:shadow-[0_1px_0_#9a4e00] transition-all duration-75 cursor-pointer overflow-hidden" id="resume-btn" type="button">
<div class="absolute inset-0 bg-gradient-to-t from-black/15 to-white/25 pointer-events-none"></div>
<span class="material-symbols-outlined text-3xl group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span>RESUME RUN</span>
</button>
<!-- Secondary Tactile Utility Grid (Restart, Settings, Home) -->
<div class="w-full grid grid-cols-3 gap-space-sm mt-space-md">
<!-- Restart Button -->
<button class="group flex flex-col items-center justify-center gap-1 min-h-[52px] py-space-sm rounded-DEFAULT bg-surface-container-high text-on-surface shadow-[0_4px_0_#060e20] active:translate-y-1 active:shadow-[0_1px_0_#060e20] hover:bg-surface-bright transition-all cursor-pointer" id="restart-btn" type="button">
<span class="material-symbols-outlined text-primary text-2xl group-hover:rotate-45 transition-transform">restart_alt</span>
<span class="font-label-md text-label-md tracking-wide">RESTART</span>
</button>
<!-- Settings Button -->
<button class="group flex flex-col items-center justify-center gap-1 min-h-[52px] py-space-sm rounded-DEFAULT bg-surface-container-high text-on-surface shadow-[0_4px_0_#060e20] active:translate-y-1 active:shadow-[0_1px_0_#060e20] hover:bg-surface-bright transition-all cursor-pointer" id="settings-btn" type="button">
<span class="material-symbols-outlined text-on-surface-variant text-2xl group-hover:rotate-90 transition-transform">settings</span>
<span class="font-label-md text-label-md tracking-wide">SETTINGS</span>
</button>
<!-- Home / Quit Button -->
<button class="group flex flex-col items-center justify-center gap-1 min-h-[52px] py-space-sm rounded-DEFAULT bg-surface-container-high text-on-surface shadow-[0_4px_0_#060e20] active:translate-y-1 active:shadow-[0_1px_0_#060e20] hover:bg-surface-bright transition-all cursor-pointer" id="home-btn" type="button">
<span class="material-symbols-outlined text-error text-2xl group-hover:-translate-y-0.5 transition-transform">home</span>
<span class="font-label-md text-label-md tracking-wide">EXIT</span>
</button>
</div>
<!-- Quick Audio Mute & Music Toggle Strip -->
<div class="w-full flex items-center justify-between mt-space-lg pt-space-sm border-t-0 bg-surface-container/60 px-space-md py-space-xs rounded-full">
<div class="flex items-center gap-space-xs text-on-surface-variant">
<span class="material-symbols-outlined text-lg">headphones</span>
<span class="font-label-md text-label-md">SFX &amp; Synthwave</span>
</div>
<div class="flex items-center gap-space-sm">
<button aria-label="Toggle SFX" class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center text-primary cursor-pointer active:scale-95 transition-transform" id="toggle-sfx" type="button">
<span class="material-symbols-outlined text-sm">volume_up</span>
</button>
<button aria-label="Toggle Music" class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center text-primary cursor-pointer active:scale-95 transition-transform" id="toggle-bgm" type="button">
<span class="material-symbols-outlined text-sm">music_note</span>
</button>
</div>
</div>
</div>
<!-- Motivational Micro-Snippet -->
<div class="w-full text-center mt-space-md">
<p class="font-body-md text-body-md text-on-surface-variant">
      High score run in progress! Catch your breath.
    </p>
</div>
</div>
<script>
  // Simple micro-interactions for tactile feel and feedback
  document.getElementById('resume-btn')?.addEventListener('click', function() {
    this.classList.add('scale-95');
    setTimeout(() => {
      this.classList.remove('scale-95');
      const scoreElem = document.getElementById('pause-score');
      if (scoreElem) {
        scoreElem.innerText = 'RESUMING...';
      }
    }, 100);
  });

  const sfxBtn = document.getElementById('toggle-sfx');
  sfxBtn?.addEventListener('click', function() {
    const icon = this.querySelector('.material-symbols-outlined');
    if (icon) {
      const isMuted = icon.innerText === 'volume_off';
      icon.innerText = isMuted ? 'volume_up' : 'volume_off';
      this.classList.toggle('text-outline', !isMuted);
      this.classList.toggle('text-primary', isMuted);
    }
  });

  const bgmBtn = document.getElementById('toggle-bgm');
  bgmBtn?.addEventListener('click', function() {
    const icon = this.querySelector('.material-symbols-outlined');
    if (icon) {
      const isMuted = icon.innerText === 'music_off';
      icon.innerText = isMuted ? 'music_note' : 'music_off';
      this.classList.toggle('text-outline', !isMuted);
      this.classList.toggle('text-primary', isMuted);
    }
  });
</script></main></body></html>
