<script>
    (function() {
      const resumeBtn = document.getElementById('resume-btn');
      const restartBtn = document.getElementById('restart-btn');
      const settingsBtn = document.getElementById('settings-btn');
      const exitBtn = document.getElementById('exit-btn');
      const sfxBtn = document.getElementById('toggle-sfx');
      const musicBtn = document.getElementById('toggle-music');

      function triggerAction(name) {
        console.log('Action triggered:', name);
      }

      if (resumeBtn) resumeBtn.addEventListener('click', () => triggerAction('RESUME'));
      if (restartBtn) restartBtn.addEventListener('click', () => triggerAction('RESTART'));
      if (settingsBtn) settingsBtn.addEventListener('click', () => triggerAction('SETTINGS'));
      if (exitBtn) exitBtn.addEventListener('click', () => triggerAction('EXIT'));

      let sfx = true;
      if (sfxBtn) {
        sfxBtn.addEventListener('click', () => {
          sfx = !sfx;
          sfxBtn.querySelector('span:last-child').textContent = sfx ? 'SFX ON' : 'SFX OFF';
          sfxBtn.querySelector('span:first-child').textContent = sfx ? 'volume_up' : 'volume_off';
        });
      }

      let music = true;
      if (musicBtn) {
        musicBtn.addEventListener('click', () => {
          music = !music;
          musicBtn.querySelector('span:last-child').textContent = music ? 'MUSIC ON' : 'MUSIC OFF';
          musicBtn.querySelector('span:first-child').textContent = music ? 'music_note' : 'music_off';
        });
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Escape') {
          e.preventDefault();
          if (resumeBtn) resumeBtn.click();
        } else if (e.key === 'r' || e.key === 'R') {
          if (restartBtn) restartBtn.click();
        } else if (e.key === 'o' || e.key === 'O') {
          if (settingsBtn) settingsBtn.click();
        } else if (e.key === 'q' || e.key === 'Q') {
          if (exitBtn) exitBtn.click();
        }
      });
    })();
  </script>
