<script>
  (function() {
    // Subtle Arcade Particle Burst for High Score
    const canvas = document.getElementById('game-over-sparks');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = canvas.offsetWidth);
    let height = (canvas.height = canvas.offsetHeight);

    const particles = [];
    const colors = ['#ffb95f', '#ee9800', '#4fdbc8', '#89ceff', '#ffffff'];

    for (let i = 0; i < 40; i++) {
      particles.push({
        x: width * 0.5 + (Math.random() - 0.5) * 120,
        y: height * 0.16 + (Math.random() - 0.5) * 40,
        vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.7) * 3.5,
        size: Math.random() * 3 + 1.5,
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 1,
        life: Math.random() * 60 + 40
      });
    }

    function render() {
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.alpha -= 0.012;

        if (p.alpha > 0) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 6;
          ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
      requestAnimationFrame(render);
    }
    render();

    window.addEventListener('resize', () => {
      if (!canvas) return;
      width = canvas.width = canvas.offsetWidth;
      height = canvas.height = canvas.offsetHeight;
    });

    // Score Counter Roll-up Micro-interaction
    const scoreEl = document.getElementById('final-score-counter');
    const targetScore = 264850;
    const duration = 1200;
    const startTime = performance.now();

    function updateScore(currentTime) {
      const elapsed = currentTime - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const easeOutQuad = 1 - (1 - progress) * (1 - progress);
      const currentScore = Math.floor(easeOutQuad * targetScore);
      scoreEl.textContent = currentScore.toLocaleString();
      if (progress < 1) {
        requestAnimationFrame(updateScore);
      } else {
        scoreEl.textContent = targetScore.toLocaleString();
      }
    }
    requestAnimationFrame(updateScore);
  })();
</script></main></body></html>
