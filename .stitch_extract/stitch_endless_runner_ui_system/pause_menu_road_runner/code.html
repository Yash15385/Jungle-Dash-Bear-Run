  </head><body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen select-none pt-safe pb-safe"><main class="flex flex-col relative w-full flex-1 bg-surface"><div class="flex flex-col w-full relative overflow-hidden select-none px-margin-sm py-space-md">

<!-- Main Centered Modal Dialog Card -->

<!-- Top Floating Arcade Badge / Header -->
<div class="relative -mb-4 z-20 flex items-center justify-center">
<div class="px-space-lg py-space-xs rounded-full bg-gradient-to-r from-secondary-container via-secondary to-secondary-container text-on-secondary shadow-lg flex items-center gap-space-xs transform hover:scale-105 transition-transform duration-200" style="box-shadow: 0 4px 0 #b45309, 0 10px 20px rgba(238, 152, 0, 0.4);">

<span class="font-headline-md text-headline-md tracking-wider uppercase text-on-secondary drop-shadow">GAME PAUSED</span>

</div>

<!-- Modal Panel Body -->

<!-- Current Run Snapshot Bento Card -->
<div class="w-full rounded bg-surface-container-low/95 p-space-sm flex flex-col gap-space-xs shadow-inner">
<div class="flex items-center justify-between px-space-xs pt-space-xs">

<!-- Metric Items Grid -->

<!-- Score -->

<span class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1">

              SCORE
            </span>
<span class="font-headline-sm text-headline-sm text-primary-fixed pt-space-xs tracking-tight">48,320</span>
</div>
<!-- Distance -->

<span class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1">

              METERS

</div>
<!-- Coins -->

<span class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1">

              COINS
            </span>
<span class="font-headline-sm text-headline-sm text-secondary pt-space-xs tracking-tight">284</span>
</div>
</div>

<!-- Quick Toggles Toolbar (Audio & Haptics) -->

<span class="font-label-md text-label-md text-on-surface-variant">QUICK CONTROLS</span>
<div class="flex items-center gap-space-sm" id="toggle-container">
<!-- Music Toggle Button -->
<button aria-label="Toggle Music" class="toggle-btn w-10 h-10 rounded-full bg-surface-bright flex items-center justify-center text-tertiary shadow transition-all duration-150 active:scale-90" id="music-toggle" style="box-shadow: 0 0 12px rgba(79, 219, 200, 0.35);">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">music_note</span>
</button>
<!-- SFX Toggle Button -->
<button aria-label="Toggle SFX" class="toggle-btn w-10 h-10 rounded-full bg-surface-bright flex items-center justify-center text-primary shadow transition-all duration-150 active:scale-90" id="sfx-toggle" style="box-shadow: 0 0 12px rgba(137, 206, 255, 0.35);">

</button>

<span class="material-symbols-outlined text-title-md">home</span>
<span>MAIN MENU</span>
</button>

<!-- Helpful Pro-Tip Footer Bar -->
<div class="w-full bg-surface-container-lowest/70 rounded-full px-space-md py-space-xs flex items-center gap-space-xs">
<span class="material-symbols-outlined text-secondary text-body-lg flex-shrink-0" style="font-variation-settings: 'FILL' 1;">tips_and_updates</span>
<p class="font-body-md text-body-md text-on-surface-variant truncate">
<strong class="text-secondary font-bold">Tip:</strong> Swipe down in air to dive under high road barriers!
        </p>
</div>
</div>
<!-- Brand Mini Logo Footer Stamp -->
<div class="mt-space-md flex items-center gap-space-xs opacity-75">
<span class="w-2 h-2 rounded-full bg-primary animate-ping"></span>
<span class="font-label-md text-label-md text-outline tracking-widest uppercase">ROAD RUNNER ARCADE • PAUSE ENGINE</span>
</div>
</div>
</div>
<script>
  // Quick tactile interaction handlers for toggles
  document.querySelectorAll('.toggle-btn').forEach(button => {
    button.addEventListener('click', () => {
      const isMuted = button.classList.contains('opacity-40');
      if (isMuted) {
        button.classList.remove('opacity-40');
        button.style.filter = 'grayscale(0%)';
      } else {
        button.classList.add('opacity-40');
        button.style.filter = 'grayscale(80%)';
      }
    });
  });

  // Tactile button compression micro-interactions
  const addPressEffect = (id, baseShadow) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('mousedown', () => {
      el.style.boxShadow = '0 1px 0 rgba(0,0,0,0.5)';
    });
    el.addEventListener('mouseup', () => {
      el.style.boxShadow = baseShadow;
    });
    el.addEventListener('mouseleave', () => {
      el.style.boxShadow = baseShadow;
    });
    el.addEventListener('touchstart', () => {
      el.style.boxShadow = '0 1px 0 rgba(0,0,0,0.5)';
    });
    el.addEventListener('touchend', () => {
      el.style.boxShadow = baseShadow;
    });
  };

  addPressEffect('btn-resume', '0 5px 0 #005048, 0 12px 24px rgba(0, 174, 157, 0.45)');
  addPressEffect('btn-restart', '0 4px 0 #8c4300, 0 8px 18px rgba(238, 152, 0, 0.35)');
  addPressEffect('btn-menu', '0 3px 0 #060e20');
</script></main></body></html>
