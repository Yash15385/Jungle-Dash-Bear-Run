<script>
    (function() {
      const resumeBtn = document.getElementById('btn-resume');
      const restartBtn = document.getElementById('btn-restart');
      const settingsBtn = document.getElementById('btn-settings');
      const menuBtn = document.getElementById('btn-menu');
      const audioBtn = document.getElementById('btn-audio');
      const musicBtn = document.getElementById('btn-music');
      const audioIcon = document.getElementById('audio-icon');
      const musicIcon = document.getElementById('music-icon');

      let audioEnabled = true;
      let musicEnabled = true;

      function triggerAction(actionName) {
        resumeBtn.style.transform = 'scale(0.98)';
        setTimeout(() => {
          resumeBtn.style.transform = '';
        }, 120);
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Escape') {
          e.preventDefault();
          triggerAction('Resume');
        } else if (e.code === 'KeyR') {
          e.preventDefault();
          restartBtn.click();
        }
      });

      resumeBtn.addEventListener('click', () => triggerAction('Resume'));
      restartBtn.addEventListener('click', () => {
        restartBtn.classList.add('brightness-125');
        setTimeout(() => restartBtn.classList.remove('brightness-125'), 150);
      });
      settingsBtn.addEventListener('click', () => {
        settingsBtn.classList.add('brightness-125');
        setTimeout(() => settingsBtn.classList.remove('brightness-125'), 150);
      });
      menuBtn.addEventListener('click', () => {
        menuBtn.classList.add('brightness-125');
        setTimeout(() => menuBtn.classList.remove('brightness-125'), 150);
      });

      audioBtn.addEventListener('click', () => {
        audioEnabled = !audioEnabled;
        audioIcon.textContent = audioEnabled ? 'volume_up' : 'volume_off';
        audioBtn.querySelector('span:last-child').textContent = audioEnabled ? 'SFX ON' : 'SFX OFF';
      });

      musicBtn.addEventListener('click', () => {
        musicEnabled = !musicEnabled;
        musicIcon.textContent = musicEnabled ? 'music_note' : 'music_off';
        musicBtn.querySelector('span:last-child').textContent = musicEnabled ? 'MUSIC ON' : 'MUSIC OFF';
      });
    })();
  </script>
