<script>
  // Dynamic Game HUD Tick Simulation (Lightweight micro-interactions)
  (function() {
    let score = 48320;
    let distance = 1420;
    let coins = 284;
    let timer = 6.4;

    const scoreEl = document.getElementById('score-val');
    const distEl = document.getElementById('distance-val');
    const coinEl = document.getElementById('coin-val');
    const timerEl = document.getElementById('timer-val');
    const boostBtn = document.getElementById('boost-btn');
    const pauseBtn = document.getElementById('pause-btn');

    // Run ticker
    const interval = setInterval(() => {
      score += 15;
      distance += 1;
      
      if (scoreEl) scoreEl.textContent = score.toLocaleString();
      if (distEl) distEl.innerHTML = `${distance.toLocaleString()}<span class="font-body-md text-body-md text-on-surface-variant font-bold ml-0.5">m</span>`;
      
      // Random coin pickup micro-effect
      if (Math.random() > 0.8) {
        coins += 1;
        if (coinEl) {
          coinEl.textContent = coins;
          coinEl.classList.add('text-secondary-fixed');
          setTimeout(() => coinEl.classList.remove('text-secondary-fixed'), 200);
        }
      }

      // Decrement powerup timer
      if (timer > 0.1) {
        timer = Math.max(0, +(timer - 0.1).toFixed(1));
        if (timerEl) timerEl.textContent = `${timer.toFixed(1)}s`;
      }
    }, 100);

    // Boost Action Trigger Micro-Interaction
    if (boostBtn) {
      boostBtn.addEventListener('click', () => {
        score += 500;
        if (scoreEl) {
          scoreEl.classList.add('scale-110', 'text-secondary');
          setTimeout(() => scoreEl.classList.remove('scale-110', 'text-secondary'), 300);
        }
      });
    }

    if (pauseBtn) {
      pauseBtn.addEventListener('click', () => {
        const icon = pauseBtn.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.textContent = icon.textContent === 'pause' ? 'play_arrow' : 'pause';
        }
      });
    }
  })();
</script></main></body></html>
